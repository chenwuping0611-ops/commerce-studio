<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Commerce Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/component/pear/css/pear.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin/css/loader.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin/css/admin.css') }}">
    <style id="pearadmin-bg-color"></style>
</head>
<body class="layui-layout-body pear-admin">
<div class="layui-layout layui-layout-admin">
    <div class="layui-header">
        <ul class="layui-nav layui-layout-left">
            <li class="collaspe layui-nav-item"><a href="#" class="layui-icon layui-icon-shrink-right" title="收起菜单"></a></li>
            <li class="refresh layui-nav-item"><a href="#" class="layui-icon layui-icon-refresh-1" title="刷新页面" loading="600"></a></li>
        </ul>
        <div id="control" class="layui-layout-control"></div>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item layui-hide-xs"><a href="#" class="fullScreen layui-icon layui-icon-screen-full" title="全屏"></a></li>
            <li class="layui-nav-item layui-hide-xs"><a href="https://github.com/pearadmin/pear-admin-flask" class="layui-icon layui-icon-website" title="项目主页"></a></li>
            <li class="layui-nav-item layui-hide-xs message"></li>
            <li class="layui-nav-item user">
                <a href="javascript:;">
                    <img src="{{ user.avatar }}" id="avatar" class="layui-nav-img" alt="头像">
                    <span>{{ user.realname }}</span>
                </a>
                <dl class="layui-nav-child">
                    <dd><a user-menu-url="/admin/user/center" user-menu-id="5555" user-menu-title="个人中心">个人中心</a></dd>
                    <dd><a href="javascript:void(0);" class="logout">退出登录</a></dd>
                </dl>
            </li>
            <li class="layui-nav-item setting"><a href="#" class="layui-icon layui-icon-more-vertical" title="设置"></a></li>
        </ul>
    </div>
    <div class="layui-side layui-bg-black">
        <div class="layui-logo">
            <img class="logo" alt="logo">
            <span class="title"></span>
        </div>
        <div class="layui-side-scroll">
            <div id="sideMenu"></div>
        </div>
    </div>
    <div class="layui-body"><div id="content"></div></div>
</div>
<div class="pear-cover"></div>
<div class="pear-collasped-pe collaspe"><a href="#" class="layui-icon layui-icon-shrink-right"></a></div>
<div class="loader-main"><div class="loader"></div></div>
{% include "admin/common/footer.html" %}
<script>
layui.use(["admin", "jquery", "layer", "popup"], function () {
    var admin = layui.admin;
    var $ = layui.jquery;
    var layer = layui.layer;
    var popup = layui.popup;

    admin.setConfigType("json");
    admin.setConfigPath("{{ url_for('rights.configs') }}");
    admin.render();
    admin.logout(function () {
        var loading = layer.load();
        $.ajax({
            url: "{{ url_for('passport.logout') }}",
            dataType: "json",
            type: "post",
            success: function (result) {
                layer.close(loading);
                if (result.success) {
                    popup.success(result.msg, function () {
                        location.href = "{{ url_for('passport.login') }}";
                    });
                }
            }
        });
    });
    admin.message();
});
</script>
</body>
</html>
