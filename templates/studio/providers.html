{% extends "studio/base.html" %}
{% block title %}模型供应商 | Commerce Studio{% endblock %}
{% block content %}
<div class="studio-page-header">
    <div>
        <div class="studio-eyebrow">模型供应商</div>
        <h1>模型供应商</h1>
        <p>维护官方 API 或中转 API 连接，并分别管理图片、视频和语言模型定义。</p>
    </div>
    <div class="studio-toolbar-right">
        <button class="layui-btn studio-btn-primary" id="newProvider">新增供应商</button>
        <button class="layui-btn studio-btn-quiet" id="newModel">新增模型</button>
    </div>
</div>

<section class="studio-card">
    <div class="studio-card-header">
        <h2>供应商连接</h2>
        <span class="studio-helper">列表中不会显示完整 API Key</span>
    </div>
    <div class="studio-card-body">
        <div class="studio-provider-list" id="providerList">
            <div class="studio-empty">正在加载供应商</div>
        </div>
    </div>
</section>

<section class="studio-card studio-section-gap">
    <div class="studio-card-header">
        <h2>模型定义</h2>
        <span class="studio-helper">仅发送已启用的请求字段</span>
    </div>
    <div class="studio-table-wrap">
        <table class="studio-table">
            <thead>
            <tr>
                <th>模型名称</th><th>模型标识</th><th>类型</th><th>供应商</th>
                <th>字段数</th><th>状态</th><th>操作</th>
            </tr>
            </thead>
            <tbody id="modelTable">
            <tr><td colspan="7" class="studio-empty">正在加载模型</td></tr>
            </tbody>
        </table>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var providers = [];
    var models = [];

    function fitArea(area) {
        area = area || ["820px", "760px"];
        var requestedWidth = parseInt(area[0], 10) || 820;
        var requestedHeight = parseInt(area[1], 10) || 760;
        var viewportWidth = Math.max(document.documentElement.clientWidth || window.innerWidth, 320);
        var viewportHeight = Math.max(document.documentElement.clientHeight || window.innerHeight, 260);
        return [
            Math.min(requestedWidth, Math.max(280, viewportWidth - 24)) + "px",
            Math.min(requestedHeight, Math.max(240, viewportHeight - 24)) + "px"
        ];
    }

    function openFrame(title, url, area) {
        layui.use("layer", function () {
            layui.layer.open({
                type: 2,
                title: title,
                shade: 0.1,
                area: fitArea(area),
                content: url,
                maxmin: true,
                resize: true
            });
        });
    }

    function refreshBalance(providerId, scope) {
        var output = document.getElementById(
            "provider" + (scope === "token" ? "Token" : "User") + "Balance" + providerId
        );
        if (!output) return Promise.resolve();
        output.textContent = "查询中...";
        output.className = "provider-balance-value is-loading";
        return Studio.request("/studio/api/providers/" + providerId +
            "/balance?scope=" + scope, {method: "POST"})
            .then(function (result) {
                output.textContent = Studio.formatBalance(result.data.balance, scope);
                output.className = "provider-balance-value";
                output.title = JSON.stringify(result.data.balance || {});
            })
            .catch(function (error) {
                output.textContent = "查询失败";
                output.className = "provider-balance-value is-error";
                output.title = error.message;
            });
    }

    function renderProviders() {
        var list = document.getElementById("providerList");
        if (!providers.length) {
            list.innerHTML = '<div class="studio-empty">暂无供应商，请先新增 API 连接。</div>';
            return;
        }
        list.innerHTML = providers.map(function (item) {
            var activeModels = (item.models || []).filter(function (model) {
                return model.enabled;
            });
            return '<article class="studio-provider-card">' +
                '<div class="studio-provider-main"><div><div class="studio-provider-title"><h3>' +
                    Studio.escapeHtml(item.name) + '</h3>' +
                    '<span class="studio-pill ' + (item.enabled ? "green" : "gray") + '">' +
                    (item.enabled ? "启用" : "停用") + '</span></div>' +
                    '<div class="studio-provider-url">' + Studio.escapeHtml(item.base_url) + '</div></div>' +
                '<div class="studio-provider-actions">' +
                    '<button class="layui-btn layui-btn-xs studio-btn-quiet edit-provider" data-id="' +
                    item.id + '">编辑</button>' +
                    '<button class="layui-btn layui-btn-xs studio-btn-quiet balance-provider" data-id="' +
                    item.id + '" data-scope="user">查询用户余额</button>' +
                    '<button class="layui-btn layui-btn-xs studio-btn-quiet balance-provider" data-id="' +
                    item.id + '" data-scope="token">查询 Token 余额</button>' +
                '</div></div>' +
                '<div class="studio-provider-meta"><span>API Key：' +
                    (item.api_key_configured ? "已配置" : "未配置") +
                    '</span><span>已启用模型：' + activeModels.length +
                    ' 个</span><span class="provider-balance-item">用户余额：<span class="provider-balance-value" id="providerUserBalance' +
                    item.id + '">' + (item.api_key_configured ? "未查询" : "未配置 Key") +
                    '</span></span><span class="provider-balance-item">Token 余额：<span class="provider-balance-value" id="providerTokenBalance' +
                    item.id + '">' + (item.api_key_configured ? "未查询" : "未配置 Key") +
                    '</span></span></div></article>';
        }).join("");

        list.querySelectorAll(".edit-provider").forEach(function (button) {
            button.addEventListener("click", function () {
                openFrame("编辑供应商", "/studio/forms/provider?id=" +
                    encodeURIComponent(button.dataset.id), ["820px", "760px"]);
            });
        });
        list.querySelectorAll(".balance-provider").forEach(function (button) {
            button.addEventListener("click", function () {
                refreshBalance(button.dataset.id, button.dataset.scope);
            });
        });
    }

    function renderModels() {
        var table = document.getElementById("modelTable");
        if (!models.length) {
            table.innerHTML = '<tr><td colspan="7" class="studio-empty">暂无模型定义</td></tr>';
            return;
        }
        function mediaTypeLabel(mediaType) {
            return mediaType === "VIDEO"
                ? "视频"
                : (mediaType === "CHAT" ? "语言模型" : "图片");
        }
        table.innerHTML = models.map(function (item) {
            return '<tr><td><b>' + Studio.escapeHtml(item.name) + '</b></td>' +
                '<td class="muted">' + Studio.escapeHtml(item.model_code) + '</td>' +
                '<td>' + mediaTypeLabel(item.media_type) + '</td>' +
                '<td>' + Studio.escapeHtml(item.provider_name) + '</td>' +
                '<td>' + (item.parameter_schema || []).length + '</td>' +
                '<td><span class="studio-pill ' + (item.enabled ? "green" : "gray") + '">' +
                    (item.enabled ? "启用" : "停用") + '</span></td>' +
                '<td><span class="studio-actions">' +
                    '<button class="layui-btn layui-btn-xs studio-btn-quiet edit-model" data-id="' +
                    item.id + '">编辑</button>' +
                    '<button class="layui-btn layui-btn-xs layui-btn-danger delete-model" data-id="' +
                    item.id + '">停用</button></span></td></tr>';
        }).join("");

        table.querySelectorAll(".edit-model").forEach(function (button) {
            button.addEventListener("click", function () {
                openFrame("编辑模型", "/studio/forms/model?id=" +
                    encodeURIComponent(button.dataset.id), ["1120px", "800px"]);
            });
        });
        table.querySelectorAll(".delete-model").forEach(function (button) {
            button.addEventListener("click", function () {
                if (!window.confirm("确定要停用这个模型吗？")) return;
                Studio.request("/studio/api/models/" + button.dataset.id, {method: "DELETE"})
                    .then(loadData)
                    .catch(function (error) { Studio.toast(error.message, "error"); });
            });
        });
    }

    function loadData() {
        return Studio.request("/studio/api/providers").then(function (result) {
            providers = result.data;
            models = [];
            providers.forEach(function (provider) {
                (provider.models || []).forEach(function (model) {
                    models.push(model);
                });
            });
            renderProviders();
            renderModels();
            providers.filter(function (provider) {
                return provider.enabled && provider.api_key_configured;
            }).forEach(function (provider) {
                refreshBalance(provider.id, "user");
                refreshBalance(provider.id, "token");
            });
        });
    }

    window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin || !event.data ||
            event.data.source !== "commerce-studio-form" ||
            event.data.resource !== "providers") return;
        loadData().catch(function (error) { Studio.toast(error.message, "error"); });
    });

    document.getElementById("newProvider").addEventListener("click", function () {
        openFrame("新增供应商", "/studio/forms/provider", ["820px", "760px"]);
    });
    document.getElementById("newModel").addEventListener("click", function () {
        if (!providers.some(function (provider) { return provider.enabled; })) {
            Studio.toast("请先新增并启用一个供应商", "error");
            return;
        }
        openFrame("新增模型", "/studio/forms/model", ["1120px", "800px"]);
    });

    loadData().catch(function (error) { Studio.toast(error.message, "error"); });
});
</script>
{% endblock %}
