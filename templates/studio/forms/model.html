{% extends "studio/base.html" %}
{% block title %}供应商模型目录{% endblock %}
{% block content %}
<div class="studio-iframe-form studio-model-iframe-form">
    <form class="layui-form studio-form" id="modelForm">
        <input type="hidden" name="id" id="modelId">

        <div class="studio-modal-section">
            <div class="studio-modal-section-title">选择供应商模型</div>
            <div class="studio-note studio-note-small">
                模型名称、模型标识、接口路径和请求参数由供应商代码目录固定；这里仅负责选择模型并启用。
            </div>
            <div class="studio-form-grid">
                <div>
                    <label class="studio-field-label" for="modelProvider">供应商</label>
                    <select name="provider_id" id="modelProvider" required></select>
                </div>
                <div>
                    <label class="studio-field-label" for="modelCatalog">模型目录</label>
                    <select name="catalog_code" id="modelCatalog" required></select>
                </div>
            </div>
            <div class="studio-form-message" id="catalogStatus" role="status"></div>
        </div>

        <div class="studio-modal-section">
            <div class="studio-modal-section-title">
                <span>模型参数</span>
                <span class="studio-helper">只读目录</span>
            </div>
            <div class="studio-catalog-model-summary" id="modelSummary">
                <div class="studio-empty studio-empty-compact">请选择供应商模型</div>
            </div>
            <div class="studio-catalog-parameter-list" id="modelParams"></div>
        </div>

        <div class="studio-form-actions studio-iframe-actions">
            <button class="layui-btn studio-btn-primary" lay-submit id="enableModel">
                启用模型
            </button>
            <button type="button" class="layui-btn studio-btn-quiet" id="closeModel">关闭</button>
        </div>
        <div class="studio-form-message" id="modelMessage" role="status"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var query = new URLSearchParams(window.location.search);
    var modelId = query.get("id") || "";
    var requestedProviderId = query.get("provider_id") || "";
    var requestedDepartmentId = query.get("dept_id") || "";
    var form = document.getElementById("modelForm");
    var providerSelect = document.getElementById("modelProvider");
    var catalogSelect = document.getElementById("modelCatalog");
    var summary = document.getElementById("modelSummary");
    var paramsNode = document.getElementById("modelParams");
    var status = document.getElementById("catalogStatus");
    var message = document.getElementById("modelMessage");
    var enableButton = document.getElementById("enableModel");
    var providers = [];
    var models = [];
    var catalog = null;
    var selectedModel = null;
    var loadingCatalog = false;

    function mediaTypeLabel(mediaType) {
        return mediaType === "VIDEO"
            ? "视频"
            : (mediaType === "CHAT" ? "语言模型" : "图片");
    }

    function setMessage(text, isError) {
        message.textContent = text || "";
        message.className = "studio-form-message" + (isError ? " is-error" : "");
    }

    function setStatus(text, isError) {
        status.textContent = text || "";
        status.className = "studio-form-message" + (isError ? " is-error" : "");
    }

    function closeForm(text) {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.postMessage({
                source: "commerce-studio-form",
                resource: "providers"
            }, window.location.origin);
            var index = window.parent.layer.getFrameIndex(window.name);
            window.parent.layer.msg(text, {icon: 1, time: 650}, function () {
                window.parent.layer.close(index);
            });
            return;
        }
        Studio.toast(text);
    }

    function parameterValue(value) {
        if (value === null || value === undefined || value === "") return "未设置";
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
    }

    function parameterOptions(options) {
        if (!Array.isArray(options) || !options.length) return "无";
        return options.map(function (item) {
            if (item && typeof item === "object") {
                return item.value == null ? item.label : item.value;
            }
            return item;
        }).join("、");
    }

    function renderSummary(model) {
        if (!model) {
            summary.innerHTML = '<div class="studio-empty studio-empty-compact">请选择供应商模型</div>';
            paramsNode.innerHTML = "";
            enableButton.disabled = true;
            return;
        }
        enableButton.disabled = false;
        enableButton.textContent = model.enabled ? "保存启用状态" : "启用模型";
        summary.innerHTML =
            '<div class="studio-catalog-summary-grid">' +
                '<div><span>模型名称</span><strong>' + Studio.escapeHtml(model.name) + '</strong></div>' +
                '<div><span>模型标识</span><strong>' + Studio.escapeHtml(model.code) + '</strong></div>' +
                '<div><span>类型</span><strong>' + mediaTypeLabel(model.media_type) + '</strong></div>' +
                '<div><span>提交地址</span><strong>' + Studio.escapeHtml(model.generation_path || "供应商默认") + '</strong></div>' +
                '<div><span>查询地址</span><strong>' + Studio.escapeHtml(model.result_path || "同步返回或由任务接口处理") + '</strong></div>' +
                '<div><span>当前状态</span><strong>' + (model.enabled ? "已启用" : "未启用") + '</strong></div>' +
            '</div>' +
            '<div class="studio-catalog-description">' + Studio.escapeHtml(model.description || "") + '</div>';

        paramsNode.innerHTML = (model.parameter_schema || []).map(function (item) {
            var runtime = item.runtime_key || "固定协议字段";
            return '<div class="studio-catalog-parameter">' +
                '<div class="studio-catalog-parameter-head">' +
                    '<strong>' + Studio.escapeHtml(item.label || item.field) + '</strong>' +
                    '<code>' + Studio.escapeHtml(item.field) + '</code>' +
                '</div>' +
                '<div class="studio-catalog-parameter-meta">' +
                    '<span>运行时：' + Studio.escapeHtml(runtime) + '</span>' +
                    '<span>类型：' + Studio.escapeHtml(item.value_type || "string") + '</span>' +
                    '<span>默认值：' + Studio.escapeHtml(parameterValue(item.value)) + '</span>' +
                    '<span>可选值：' + Studio.escapeHtml(parameterOptions(item.options)) + '</span>' +
                '</div>' +
                (item.hint ? '<div class="studio-field-hint">' +
                    Studio.escapeHtml(item.hint) + '</div>' : "") +
            '</div>';
        }).join("");
    }

    function renderCatalog() {
        var items = catalog && catalog.models || [];
        if (!items.length) {
            catalogSelect.innerHTML = '<option value="">该供应商暂无代码模型目录</option>';
            catalogSelect.disabled = true;
            renderSummary(null);
            setStatus("该供应商暂无可用模型目录", true);
            return;
        }
        catalogSelect.disabled = false;
        catalogSelect.innerHTML = items.map(function (item) {
            return '<option value="' + Studio.escapeHtml(item.code) + '">' +
                Studio.escapeHtml(item.name) + ' · ' +
                mediaTypeLabel(item.media_type) + ' · ' +
                Studio.escapeHtml(item.code) +
                (item.enabled ? "（已启用）" : "（未启用）") +
                '</option>';
        }).join("");

        var preferredCode = selectedModel
            ? selectedModel.model_code
            : (query.get("catalog_code") || "");
        var preferred = items.find(function (item) {
            return item.code === preferredCode;
        }) || items.find(function (item) {
            return !item.enabled;
        }) || items[0];
        catalogSelect.value = preferred.code;
        renderSelectedCatalogModel();
        setStatus(
            "目录参数由代码固定，共 " + items.length + " 个模型；页面只保存启用状态。"
        );
    }

    function renderSelectedCatalogModel() {
        var model = (catalog && catalog.models || []).find(function (item) {
            return item.code === catalogSelect.value;
        });
        renderSummary(model || null);
        layui.use("form", function () {
            layui.form.render("select");
        });
    }

    function loadCatalog(providerId) {
        if (!providerId) {
            catalog = null;
            renderCatalog();
            return Promise.resolve();
        }
        loadingCatalog = true;
        setStatus("正在加载供应商模型目录...");
        return Studio.request(
            "/studio/api/provider-catalog?provider_id=" +
            encodeURIComponent(providerId)
        ).then(function (result) {
            catalog = result.data;
            renderCatalog();
        }).finally(function () {
            loadingCatalog = false;
        });
    }

    function renderProviders() {
        var currentProviderId = selectedModel
            ? selectedModel.provider_id
            : (requestedProviderId || (providers[0] && providers[0].id));
        providerSelect.innerHTML = providers.filter(function (provider) {
            return provider.enabled || String(provider.id) === String(currentProviderId);
        }).map(function (provider) {
            return '<option value="' + provider.id + '">' +
                Studio.escapeHtml(provider.name) + '</option>';
        }).join("");
        providerSelect.value = String(currentProviderId || "");
        providerSelect.disabled = Boolean(modelId);
        layui.use("form", function () {
            layui.form.render("select");
        });
    }

    function loadData() {
        setMessage("正在加载模型目录...");
        var suffix = requestedDepartmentId
            ? "?dept_id=" + encodeURIComponent(requestedDepartmentId)
            : "";
        return Studio.request("/studio/api/providers" + suffix).then(function (result) {
            providers = result.data || [];
            models = [];
            providers.forEach(function (provider) {
                (provider.models || []).forEach(function (model) {
                    models.push(model);
                });
            });
            selectedModel = modelId
                ? models.find(function (item) {
                    return String(item.id) === String(modelId);
                })
                : null;
            if (modelId && !selectedModel) {
                throw new Error("模型不存在或已停用");
            }
            renderProviders();
            var providerId = selectedModel
                ? selectedModel.provider_id
                : providerSelect.value;
            return loadCatalog(providerId);
        }).then(function () {
            setMessage("");
        });
    }

    providerSelect.addEventListener("change", function () {
        if (modelId || loadingCatalog) return;
        loadCatalog(providerSelect.value).catch(function (error) {
            setStatus(error.message, true);
        });
    });
    catalogSelect.addEventListener("change", renderSelectedCatalogModel);

    document.getElementById("closeModel").addEventListener("click", function () {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.layer.close(window.parent.layer.getFrameIndex(window.name));
        }
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        var providerId = providerSelect.value;
        var catalogCode = catalogSelect.value;
        if (!providerId || !catalogCode) {
            setMessage("请选择供应商和模型目录", true);
            return;
        }
        setMessage("正在保存启用状态...");
        enableButton.disabled = true;
        Studio.request("/studio/api/models", {
            method: "POST",
            body: JSON.stringify({
                id: modelId || null,
                provider_id: providerId,
                catalog_code: catalogCode,
                enabled: true
            })
        }).then(function () {
            closeForm("模型已启用");
        }).catch(function (error) {
            setMessage(error.message, true);
            enableButton.disabled = false;
        });
    });

    layui.use("form", function () {
        layui.form.render();
    });
    loadData().catch(function (error) {
        setMessage(error.message, true);
    });
});
</script>
{% endblock %}
