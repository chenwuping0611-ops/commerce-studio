{% extends "studio/base.html" %}
{% block title %}模型定义{% endblock %}
{% block content %}
<div class="studio-iframe-form studio-model-iframe-form">
    <form class="layui-form studio-form" id="modelForm">
        <input type="hidden" name="id" id="modelId">
        <div class="studio-modal-section">
            <div class="studio-modal-section-title">模型基础信息</div>
            <div class="studio-form-grid">
                <div>
                    <label class="studio-field-label">供应商</label>
                    <select name="provider_id" id="modelProvider" required></select>
                </div>
                <div>
                    <label class="studio-field-label">媒体类型</label>
                    <select name="media_type" id="modelMediaType">
                        <option value="IMAGE">图片</option>
                        <option value="VIDEO">视频</option>
                        <option value="CHAT">语言模型</option>
                    </select>
                </div>
                <div>
                    <label class="studio-field-label">模型名称</label>
                    <input name="name" id="modelName" required class="layui-input" placeholder="例如 GPT Image 2">
                </div>
                <div>
                    <label class="studio-field-label">模型标识</label>
                    <input name="model_code" id="modelCode" required class="layui-input" placeholder="gpt-image-2">
                </div>
                <div>
                    <label class="studio-field-label">提交地址</label>
                    <input name="generation_path" id="modelGenerationPath" class="layui-input"
                           placeholder="留空时使用供应商默认地址">
                </div>
                <div>
                    <label class="studio-field-label">查询地址</label>
                    <input name="result_path" id="modelResultPath" class="layui-input"
                           placeholder="支持使用 {task_id} 占位符">
                </div>
                <div class="studio-field-span-2">
                    <label class="studio-field-label">模型说明</label>
                    <textarea name="description" id="modelDescription" class="layui-textarea" rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="studio-modal-section">
            <div class="studio-modal-section-title">请求字段定义</div>
            <div class="studio-note studio-note-small">
                每一行对应请求 body 中的一个字段。默认值为空时不会发送；runtime_key 用于绑定图片或视频创作页面的输入值。
            </div>
            <div class="studio-param-head">
                <span>字段名</span><span>显示名称</span><span>运行时字段</span><span>默认值</span>
                <span>可选值</span><span>类型</span><span>启用</span><span></span>
            </div>
            <div class="studio-param-list" id="modelParams"></div>
            <button type="button" class="layui-btn layui-btn-xs studio-btn-quiet" id="addParam">添加字段</button>
        </div>

        <div class="studio-form-actions studio-iframe-actions">
            <button class="layui-btn studio-btn-primary" lay-submit>保存模型</button>
            <button type="button" class="layui-btn studio-btn-quiet" id="closeModel">取消</button>
        </div>
        <div class="studio-form-message" id="modelMessage" role="status"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var query = new URLSearchParams(window.location.search);
    var modelId = query.get("id") || "";
    var form = document.getElementById("modelForm");
    var message = document.getElementById("modelMessage");
    var providers = [];
    var models = [];
    var params = [];

    var imageDefaults = [
        {field: "model", label: "模型标识", runtime_key: "", value: "gpt-image-2", value_type: "string", enabled: true},
        {field: "prompt", label: "提示词", runtime_key: "prompt", value: "", value_type: "string", enabled: true},
        {field: "n", label: "生成数量", runtime_key: "count", value: "1", min: 1, max: 8, step: 1, value_type: "number", enabled: true},
        {field: "size", label: "画面比例", runtime_key: "aspect_ratio", value: "1:1", options: ["1:1", "4:3", "16:9", "9:16"], value_type: "string", enabled: true},
        {field: "resolution", label: "分辨率", runtime_key: "resolution", value: "1k", options: ["1k", "2k", "4k"], value_type: "string", enabled: true},
        {field: "image_urls", label: "参考图片", runtime_key: "reference_images", value: "", value_type: "json", enabled: true},
        {field: "response_format", label: "返回格式", runtime_key: "", value: "url", value_type: "string", enabled: true}
    ];
    var videoDefaults = [
        {field: "model", label: "模型标识", runtime_key: "", value: "seedance-2", value_type: "string", enabled: true},
        {field: "prompt", label: "提示词", runtime_key: "prompt", value: "", value_type: "string", enabled: true},
        {field: "duration", label: "视频时长", runtime_key: "duration", value: "5", min: 1, max: 60, step: 1, value_type: "number", enabled: true},
        {field: "aspect_ratio", label: "画面比例", runtime_key: "aspect_ratio", value: "16:9", options: ["16:9", "9:16", "1:1", "4:3"], value_type: "string", enabled: true},
        {field: "resolution", label: "分辨率", runtime_key: "resolution", value: "720p", options: ["480p", "720p", "1080p"], value_type: "string", enabled: true},
        {field: "image_with_roles", label: "参考图片", runtime_key: "reference_images_with_roles", value: "", value_type: "json", enabled: true},
        {field: "video_with_roles", label: "参考视频", runtime_key: "reference_videos_with_roles", value: "", value_type: "json", enabled: true},
        {field: "generate_audio", label: "生成音频", runtime_key: "generate_audio", value: "true", value_type: "boolean", enabled: true}
    ];
    var chatDefaults = [
        {field: "model", label: "模型标识", runtime_key: "", value: "gpt-5.5", value_type: "string", enabled: true},
        {field: "messages", label: "消息内容", runtime_key: "messages", value: "", value_type: "json", enabled: true},
        {field: "max_tokens", label: "最大输出 Token", runtime_key: "max_tokens", value: "800", min: 1, max: 8192, step: 1, value_type: "number", enabled: true},
        {field: "temperature", label: "温度", runtime_key: "temperature", value: "0.2", min: 0, max: 2, step: 0.1, value_type: "number", enabled: true}
    ];

    function setMessage(text, isError) {
        message.textContent = text || "";
        message.className = "studio-form-message" + (isError ? " is-error" : "");
    }

    function closeForm(text, resource) {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.postMessage({
                source: "commerce-studio-form",
                resource: resource
            }, window.location.origin);
            var index = window.parent.layer.getFrameIndex(window.name);
            window.parent.layer.msg(text, {icon: 1, time: 650}, function () {
                window.parent.layer.close(index);
            });
            return;
        }
        Studio.toast(text);
    }

    function cloneDefaults(mediaType) {
        var defaults = mediaType === "VIDEO"
            ? videoDefaults
            : (mediaType === "CHAT" ? chatDefaults : imageDefaults);
        return JSON.parse(JSON.stringify(defaults));
    }

    function setField(id, value) {
        var field = document.getElementById(id);
        if (field) field.value = value == null ? "" : value;
    }

    function optionText(options) {
        if (typeof options === "string") {
            try {
                options = JSON.parse(options);
            } catch (error) {
                options = options.split(/[,\n]/);
            }
        }
        if (!Array.isArray(options)) return "";
        return options.map(function (option) {
            if (option && typeof option === "object") {
                return option.value == null ? "" : option.value;
            }
            return option;
        }).filter(function (option) {
            return option != null && String(option).trim() !== "";
        }).join(", ");
    }

    function renderParams() {
        var node = document.getElementById("modelParams");
        node.innerHTML = params.map(function (item, index) {
            var value = item.value == null ? "" : item.value;
            if (typeof value !== "string") value = JSON.stringify(value);
            return '<div class="studio-param-row">' +
                '<input class="layui-input param-field" data-index="' + index + '" value="' + Studio.escapeHtml(item.field || "") + '" placeholder="请求字段名">' +
                '<input class="layui-input param-label" data-index="' + index + '" value="' + Studio.escapeHtml(item.label || "") + '" placeholder="显示名称">' +
                '<input class="layui-input param-runtime" data-index="' + index + '" value="' + Studio.escapeHtml(item.runtime_key || "") + '" placeholder="runtime_key">' +
                '<input class="layui-input param-value" data-index="' + index + '" value="' + Studio.escapeHtml(value) + '" placeholder="默认值">' +
                '<input class="layui-input param-options" data-index="' + index + '" value="' +
                    Studio.escapeHtml(optionText(item.options)) + '" placeholder="例如 1:1, 4:3">' +
                '<select class="param-type" data-index="' + index + '">' +
                    '<option value="string">字符串</option><option value="number">数字</option>' +
                    '<option value="boolean">布尔值</option><option value="json">JSON</option>' +
                '</select>' +
                '<input type="checkbox" class="param-enabled" data-index="' + index + '"' +
                    (item.enabled !== false ? " checked" : "") + '>' +
                '<button type="button" class="layui-btn layui-btn-xs layui-btn-danger remove-param" data-index="' + index + '">×</button>' +
                '</div>';
        }).join("");

        node.querySelectorAll(".param-type").forEach(function (select, index) {
            select.value = params[index].value_type || "string";
        });
        node.querySelectorAll(".remove-param").forEach(function (button) {
            button.addEventListener("click", function () {
                params.splice(Number(button.dataset.index), 1);
                renderParams();
            });
        });
        layui.use("form", function () {
            layui.form.render("select");
        });
    }

    function collectParams() {
        document.querySelectorAll("#modelParams .studio-param-row").forEach(function (row, index) {
            params[index].field = row.querySelector(".param-field").value.trim();
            params[index].label = row.querySelector(".param-label").value.trim();
            params[index].runtime_key = row.querySelector(".param-runtime").value.trim();
            params[index].value = row.querySelector(".param-value").value;
            params[index].options = row.querySelector(".param-options").value
                .split(/[,\n]/)
                .map(function (item) { return item.trim(); })
                .filter(Boolean);
            params[index].value_type = row.querySelector(".param-type").value;
            params[index].enabled = row.querySelector(".param-enabled").checked;
        });
        return params;
    }

    function fillModel(model) {
        setField("modelId", model.id || "");
        setField("modelProvider", model.provider_id || "");
        setField("modelMediaType", model.media_type || "IMAGE");
        setField("modelName", model.name || "");
        setField("modelCode", model.model_code || "");
        setField("modelGenerationPath", model.generation_path || "");
        setField("modelResultPath", model.result_path || "");
        setField("modelDescription", model.description || "");
        params = model.parameter_schema && model.parameter_schema.length
            ? JSON.parse(JSON.stringify(model.parameter_schema))
            : cloneDefaults(model.media_type || "IMAGE");
        renderParams();
    }

    function renderProviders() {
        var select = document.getElementById("modelProvider");
        var currentModel = modelId ? models.find(function (item) {
            return String(item.id) === String(modelId);
        }) : null;
        var currentProviderId = currentModel ? currentModel.provider_id : "";
        select.innerHTML = providers.filter(function (provider) {
            return provider.enabled || String(provider.id) === String(currentProviderId);
        }).map(function (provider) {
            return '<option value="' + provider.id + '">' + Studio.escapeHtml(provider.name) + '</option>';
        }).join("");
        layui.use("form", function () {
            layui.form.render("select");
        });
    }

    function loadData() {
        setMessage("正在加载...");
        return Studio.request("/studio/api/providers").then(function (result) {
            providers = result.data;
            models = [];
            providers.forEach(function (provider) {
                (provider.models || []).forEach(function (model) {
                    models.push(model);
                });
            });
            renderProviders();
            var current = modelId ? models.find(function (item) {
                return String(item.id) === String(modelId);
            }) : null;
            if (current) {
                fillModel(current);
            } else {
                setField("modelProvider", providers[0] && providers[0].id || "");
                params = cloneDefaults(document.getElementById("modelMediaType").value);
                renderParams();
            }
            setMessage("");
        });
    }

    document.getElementById("modelMediaType").addEventListener("change", function () {
        if (!modelId) {
            params = cloneDefaults(this.value);
            renderParams();
        }
    });
    document.getElementById("addParam").addEventListener("click", function () {
        params.push({
            field: "",
            label: "",
            runtime_key: "",
            value: "",
            options: [],
            value_type: "string",
            enabled: true
        });
        renderParams();
    });
    document.getElementById("closeModel").addEventListener("click", function () {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.layer.close(window.parent.layer.getFrameIndex(window.name));
        }
    });
    form.addEventListener("submit", function (event) {
        event.preventDefault();
        setMessage("正在保存...");
        var payload = {};
        new FormData(form).forEach(function (value, key) {
            payload[key] = value;
        });
        payload.parameter_schema = collectParams();
        Studio.request("/studio/api/models", {
            method: "POST",
            body: JSON.stringify(payload)
        }).then(function () {
            closeForm("模型已保存", "providers");
        }).catch(function (error) {
            setMessage(error.message, true);
        });
    });

    layui.use("form", function () {
        layui.form.render();
    });
    loadData().catch(function (error) {
        setMessage(error.message, true);
    });
});
</script>
{% endblock %}
