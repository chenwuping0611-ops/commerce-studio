{% extends "studio/base.html" %}
{% block title %}产品资料{% endblock %}
{% block content %}
<div class="studio-iframe-form">
    <form class="layui-form studio-form" id="productForm">
        <input type="hidden" name="id" id="productId">
        <div class="studio-modal-section">
            <div class="studio-modal-section-title">基础资料</div>
            <div class="studio-form-grid">
                <div>
                    <label class="studio-field-label">产品编码</label>
                    <input name="code" id="productCode" required class="layui-input" placeholder="例如 SKU-CAR-001">
                </div>
                <div>
                    <label class="studio-field-label">产品名称</label>
                    <input name="name" id="productName" required class="layui-input" placeholder="例如 智能电动汽车">
                </div>
                <div>
                    <label class="studio-field-label">品牌</label>
                    <input name="brand" id="productBrand" class="layui-input">
                </div>
                <div class="studio-field-span-2">
                    <label class="studio-field-label">产品描述</label>
                    <textarea name="description" id="productDescription" class="layui-textarea" rows="3"
                              placeholder="填写材质、规格、卖点和适用人群"></textarea>
                </div>
            </div>
        </div>

        <div class="studio-modal-section">
            <div class="studio-modal-section-title">产品记忆</div>
            <div class="studio-form-grid">
                <div class="studio-field-span-2">
                    <label class="studio-field-label">Product Profile（产品档案）</label>
                    <textarea name="product_profile" id="productProfile" class="layui-textarea" rows="3"
                              placeholder="填写稳定的产品身份：外形、颜色、结构和品牌识别特征"></textarea>
                </div>
                <div class="studio-field-span-2">
                    <label class="studio-field-label">产品记忆</label>
                    <textarea name="product_memory" id="productMemory" class="layui-textarea" rows="3"
                              placeholder="填写需要在后续生成中持续携带的事实、偏好和上下文"></textarea>
                </div>
                <div>
                    <label class="studio-field-label">生成规则</label>
                    <textarea name="generation_rules" id="generationRules" class="layui-textarea" rows="3"
                              placeholder="例如保持车标、车灯和轮毂结构一致"></textarea>
                </div>
                <div>
                    <label class="studio-field-label">禁止修改规则</label>
                    <textarea name="forbidden_rules" id="forbiddenRules" class="layui-textarea" rows="3"
                              placeholder="例如禁止改变主色、Logo 和核心结构"></textarea>
                </div>
            </div>
        </div>

        <div class="studio-modal-section">
            <div class="studio-modal-section-title">默认引用素材</div>
            <label class="studio-field-label">素材 URL</label>
            <textarea name="asset_urls" id="productAssets" class="layui-textarea" rows="3"
                      placeholder="每行填写一个图片或视频 URL"></textarea>
        </div>

        <div class="studio-form-actions studio-iframe-actions">
            <button class="layui-btn studio-btn-primary" lay-submit>保存产品</button>
            <button type="button" class="layui-btn studio-btn-quiet" id="closeProduct">取消</button>
        </div>
        <div class="studio-form-message" id="productMessage" role="status"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var query = new URLSearchParams(window.location.search);
    var productId = query.get("id") || "";
    var form = document.getElementById("productForm");
    var message = document.getElementById("productMessage");

    function setMessage(text, isError) {
        message.textContent = text || "";
        message.className = "studio-form-message" + (isError ? " is-error" : "");
    }

    function closeForm(text, resource) {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.postMessage({
                source: "commerce-studio-form",
                resource: resource
            }, window.location.origin);
            var index = window.parent.layer.getFrameIndex(window.name);
            window.parent.layer.msg(text, {icon: 1, time: 650}, function () {
                window.parent.layer.close(index);
            });
            return;
        }
        Studio.toast(text);
    }

    function fillProduct(product) {
        document.getElementById("productId").value = product.id || "";
        document.getElementById("productCode").value = product.code || "";
        document.getElementById("productName").value = product.name || "";
        document.getElementById("productBrand").value = product.brand || "";
        document.getElementById("productDescription").value = product.description || "";
        document.getElementById("productProfile").value = product.product_profile || "";
        document.getElementById("productMemory").value = product.product_memory || "";
        document.getElementById("generationRules").value = product.generation_rules || "";
        document.getElementById("forbiddenRules").value = product.forbidden_rules || "";
        document.getElementById("productAssets").value = (product.asset_urls || []).join("\n");
    }

    function loadProduct() {
        if (!productId) return Promise.resolve();
        setMessage("正在加载产品...");
        return Studio.request("/studio/api/products").then(function (result) {
            var product = result.data.find(function (item) {
                return String(item.id) === String(productId);
            });
            if (!product) throw new Error("产品不存在");
            fillProduct(product);
            setMessage("");
        });
    }

    document.getElementById("closeProduct").addEventListener("click", function () {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.layer.close(window.parent.layer.getFrameIndex(window.name));
        }
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        setMessage("正在保存...");
        var payload = {};
        new FormData(form).forEach(function (value, key) {
            payload[key] = value;
        });
        Studio.request("/studio/api/products", {
            method: "POST",
            body: JSON.stringify(payload)
        }).then(function () {
            closeForm("产品已保存", "products");
        }).catch(function (error) {
            setMessage(error.message, true);
        });
    });

    loadProduct().catch(function (error) {
        setMessage(error.message, true);
    });
});
</script>
{% endblock %}
