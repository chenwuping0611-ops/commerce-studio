{% extends "studio/base.html" %}
{% block title %}引用素材{% endblock %}
{% block content %}
<div class="studio-iframe-form">
    <form class="layui-form studio-form" id="assetForm">
        <input type="hidden" name="product_id" id="assetProductId">
        <div class="studio-modal-section">
            <div class="studio-modal-section-title">引用素材</div>
            <div class="layui-form-item">
                <label class="layui-form-label">素材名称</label>
                <div class="layui-input-block">
                    <input name="name" id="assetName" class="layui-input" placeholder="例如 正面参考图">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">素材位置</label>
                <div class="layui-input-block">
                    <select name="role" id="assetRole">
                        <option value="cover">主图</option>
                        <option value="front">正面</option>
                        <option value="back">背面</option>
                        <option value="left">左侧</option>
                        <option value="right">右侧</option>
                        <option value="top">顶部</option>
                        <option value="bottom">底部</option>
                        <option value="detail">细节图</option>
                        <option value="scene">场景图</option>
                        <option value="360">360 视频</option>
                        <option value="reference">其他素材</option>
                    </select>
                    <div class="studio-field-help">选择后，图片创作和视频创作会按产品素材角色携带参考内容。</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">素材类型</label>
                <div class="layui-input-block">
                    <select name="asset_type" id="assetType">
                        <option value="IMAGE">图片</option>
                        <option value="VIDEO">视频</option>
                        <option value="BOTH">图片和视频</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">上传文件</label>
                <div class="layui-input-block">
                    <label class="studio-upload studio-upload-inline" for="productAssetFile">
                        <div><strong>选择产品素材文件</strong><br><span>上传到 go-fastdfs，保存后永久保留</span></div>
                        <input id="productAssetFile" type="file" accept="image/*,video/*" hidden>
                    </label>
                    <div id="assetUploadStatus" class="studio-upload-status studio-helper"></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">素材 URL</label>
                <div class="layui-input-block">
                    <input name="url" id="assetUrl" class="layui-input" placeholder="上传文件后自动填充，也可以直接填写外部 URL">
                </div>
            </div>
        </div>

        <div class="studio-form-actions studio-iframe-actions">
            <button class="layui-btn studio-btn-primary" lay-submit>添加素材</button>
            <button type="button" class="layui-btn studio-btn-quiet" id="closeAsset">取消</button>
        </div>
        <div class="studio-form-message" id="assetMessage" role="status"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var query = new URLSearchParams(window.location.search);
    var productId = query.get("product_id") || "";
    var form = document.getElementById("assetForm");
    var message = document.getElementById("assetMessage");
    var storageAsset = null;
    document.getElementById("assetProductId").value = productId;
    var requestedRole = query.get("role") || "reference";
    var requestedType = (query.get("asset_type") || "").toUpperCase();
    var roleSelect = document.getElementById("assetRole");
    var assetTypeSelect = document.getElementById("assetType");
    var nameInput = document.getElementById("assetName");
    var roleLabels = {
        cover: "主图",
        front: "正面",
        back: "背面",
        left: "左侧",
        right: "右侧",
        top: "顶部",
        bottom: "底部",
        detail: "细节图",
        scene: "场景图",
        "360": "360 视频",
        reference: "其他素材"
    };
    if (roleLabels[requestedRole]) {
        roleSelect.value = requestedRole;
    }
    if (requestedType && ["IMAGE", "VIDEO", "BOTH"].indexOf(requestedType) !== -1) {
        assetTypeSelect.value = requestedType;
    }

    function syncRoleDefaults() {
        var role = roleSelect.value || "reference";
        var label = roleLabels[role] || "其他素材";
        if (!nameInput.value.trim() || nameInput.dataset.autoName === "1") {
            nameInput.value = label + "参考素材";
            nameInput.dataset.autoName = "1";
        }
        if (role === "360") {
            assetTypeSelect.value = "VIDEO";
            assetTypeSelect.disabled = true;
        } else {
            assetTypeSelect.disabled = false;
        }
        layui.use("form", function () {
            layui.form.render("select");
        });
    }

    nameInput.addEventListener("input", function () {
        nameInput.dataset.autoName = "0";
    });
    roleSelect.addEventListener("change", syncRoleDefaults);
    syncRoleDefaults();

    function setMessage(text, isError) {
        message.textContent = text || "";
        message.className = "studio-form-message" + (isError ? " is-error" : "");
    }

    function closeForm(text, resource) {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.postMessage({
                source: "commerce-studio-form",
                resource: resource
            }, window.location.origin);
            var index = window.parent.layer.getFrameIndex(window.name);
            window.parent.layer.msg(text, {icon: 1, time: 650}, function () {
                window.parent.layer.close(index);
            });
            return;
        }
        Studio.toast(text);
    }

    document.getElementById("closeAsset").addEventListener("click", function () {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.layer.close(window.parent.layer.getFrameIndex(window.name));
        }
    });

    document.getElementById("productAssetFile").addEventListener("change", function (event) {
        var file = event.target.files[0];
        if (!file) return;
        var assetType = file.type.indexOf("video/") === 0 ? "VIDEO" : "IMAGE";
        if (roleSelect.value === "360") assetType = "VIDEO";
        assetTypeSelect.value = assetType;
        document.getElementById("assetUploadStatus").textContent = "正在上传产品素材...";
        Studio.uploadAssets([file], assetType, "PRODUCT_PENDING").then(function (assets) {
            storageAsset = assets[0];
            document.getElementById("assetUrl").value = storageAsset.public_url || "";
            document.getElementById("assetUploadStatus").textContent =
                "上传成功，保存产品后将永久保留：" + storageAsset.original_filename;
        }).catch(function (error) {
            storageAsset = null;
            document.getElementById("assetUploadStatus").textContent = error.message;
            Studio.toast(error.message, "error");
        }).finally(function () {
            event.target.value = "";
        });
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!productId) {
            setMessage("必须指定产品", true);
            return;
        }
        setMessage("正在保存...");
        var payload = {};
        new FormData(form).forEach(function (value, key) {
            payload[key] = value;
        });
        if (storageAsset) {
            payload.storage_asset_id = storageAsset.id;
        }
        payload.role = roleSelect.value || "reference";
        payload.asset_type = assetTypeSelect.value || "IMAGE";
        Studio.request("/studio/api/products/" + encodeURIComponent(productId) + "/assets", {
            method: "POST",
            body: JSON.stringify(payload)
        }).then(function () {
            closeForm("素材已添加", "products");
        }).catch(function (error) {
            setMessage(error.message, true);
        });
    });

    layui.use("form", function () {
        layui.form.render();
    });
});
</script>
{% endblock %}
