{% extends "studio/base.html" %}
{% block title %}Reference asset{% endblock %}
{% block content %}
<div class="studio-iframe-form">
    <form class="layui-form studio-form" id="assetForm">
        <input type="hidden" name="product_id" id="assetProductId">
        <div class="studio-modal-section">
            <div class="studio-modal-section-title">Reference asset</div>
            <div class="layui-form-item">
                <label class="layui-form-label">Asset name</label>
                <div class="layui-input-block">
                    <input name="name" class="layui-input" placeholder="Front reference image">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">Asset type</label>
                <div class="layui-input-block">
                    <select name="asset_type">
                        <option value="IMAGE">Image</option>
                        <option value="VIDEO">Video</option>
                        <option value="BOTH">Image and video</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">Asset URL</label>
                <div class="layui-input-block">
                    <input name="url" required class="layui-input" placeholder="https://...">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">Role</label>
                <div class="layui-input-block">
                    <input name="role" value="reference" class="layui-input" placeholder="reference">
                </div>
            </div>
        </div>

        <div class="studio-form-actions studio-iframe-actions">
            <button class="layui-btn studio-btn-primary" lay-submit>Add asset</button>
            <button type="button" class="layui-btn studio-btn-quiet" id="closeAsset">Cancel</button>
        </div>
        <div class="studio-form-message" id="assetMessage" role="status"></div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    var query = new URLSearchParams(window.location.search);
    var productId = query.get("product_id") || "";
    var form = document.getElementById("assetForm");
    var message = document.getElementById("assetMessage");
    document.getElementById("assetProductId").value = productId;

    function setMessage(text, isError) {
        message.textContent = text || "";
        message.className = "studio-form-message" + (isError ? " is-error" : "");
    }

    function closeForm(text, resource) {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.postMessage({
                source: "commerce-studio-form",
                resource: resource
            }, window.location.origin);
            var index = window.parent.layer.getFrameIndex(window.name);
            window.parent.layer.msg(text, {icon: 1, time: 650}, function () {
                window.parent.layer.close(index);
            });
            return;
        }
        Studio.toast(text);
    }

    document.getElementById("closeAsset").addEventListener("click", function () {
        if (window.parent && window.parent !== window && window.parent.layer) {
            window.parent.layer.close(window.parent.layer.getFrameIndex(window.name));
        }
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!productId) {
            setMessage("Product is required", true);
            return;
        }
        setMessage("Saving...");
        var payload = {};
        new FormData(form).forEach(function (value, key) {
            payload[key] = value;
        });
        Studio.request("/studio/api/products/" + encodeURIComponent(productId) + "/assets", {
            method: "POST",
            body: JSON.stringify(payload)
        }).then(function () {
            closeForm("Asset added", "products");
        }).catch(function (error) {
            setMessage(error.message, true);
        });
    });

    layui.use("form", function () {
        layui.form.render();
    });
});
</script>
{% endblock %}
